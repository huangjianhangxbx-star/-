<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' data: blob:"
    />
    <title>贴图绘制 · 星骸工坊</title>
    <link rel="stylesheet" href="workshop-theme.css" />
    <link rel="stylesheet" href="paint-workspace.css" />
  </head>
  <body>
    <header>
      <div><b>贴图绘制</b><span id="paint-title">正在连接主会话…</span></div>
      <nav>
        <button id="paint-save">保存项目（含当前资产）</button
        ><button id="paint-return">返回建模</button>
      </nav>
    </header>
    <div id="paint-scope"></div><div id="paint-target-bar"><label>绘画目标 <select id="paint-target-switch" aria-label="绘画目标"></select></label></div>
    <div id="paint-toolbar"></div>
    <main>
      <section id="paint-view"><div id="paint-display"></div></section>
      <aside>
        <section id="paint-layers"></section><h2>选色</h2><div class="actions"><button id="paint-color-tab">色轮／色板</button><button id="paint-previous">上一色</button></div><canvas id="paint-wheel" width="184" height="184"></canvas>

        <label
          >颜色<input id="paint-color" type="color" value="#ffffff" /><input
            id="paint-hex"
            value="#ffffff"
            maxlength="7"
            aria-label="绘画颜色HEX"
        /></label>
        <div id="paint-palette"></div><div id="paint-recent" aria-label="最近使用色"></div><details id="paint-color-values"><summary>RGB / HSV 数值</summary><label>RGB <input id="paint-rgb" aria-label="RGB"></label><label>HSV <input id="paint-hsv" aria-label="HSV"></label></details><div id="paint-symmetry"></div><div id="paint-queue-actions" hidden><button id="paint-retry">重试未提交笔触</button><button id="paint-discard">放弃未提交笔触</button></div>
        <div class="actions">
          <button id="paint-undo">撤销</button
          ><button id="paint-redo">重做</button
          ><button id="paint-home">查看目标</button>
        </div>
<details><summary>帮助与边界</summary><p>右键旋转，中键平移；B画笔、E擦除、L直线、R矩形、O椭圆、G填充、M选区。Alt临时吸色。折线Enter完成、Esc取消。Shift约束角度；选区Shift加选、Ctrl减选。</p><p>绘画不改体素；选择仅约束贴图。对称中心按资产作者空间，Z向上。图层属于各自画布；擦除只影响当前层。M框选后Ctrl+C复制，Ctrl+V粘贴，点击定位、Enter确认、Esc取消。复制来源可选当前层或可见绘图。</p></details>
      </aside>
    </main>
    <footer id="paint-status" role="status">连接中</footer>
    <script src="paint-workspace.js"></script>
  </body>
</html>
