<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>岩体塑形 · TOOL-011 造型原型</title>
<style>
:root{color-scheme:dark;--bg:#1d2228;--panel:#252b31;--line:#454c53;--muted:#a1adb8;--ink:#e3e8ed;--accent:#d7ad65}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:13px "Microsoft YaHei","Segoe UI",sans-serif}header{height:65px;border-bottom:2px solid var(--accent);padding:11px 18px;display:flex;align-items:center;justify-content:space-between;gap:16px}h1{font-size:18px;margin:0 0 3px;font-weight:600}header small{color:var(--muted);font-size:11px}.gate{color:var(--accent);white-space:nowrap}main{height:calc(100dvh - 65px);display:grid;grid-template-columns:274px minmax(0,1fr)}aside{padding:15px;overflow:auto;border-right:1px solid var(--line);background:var(--panel)}section+section{border-top:1px solid var(--line);margin-top:17px;padding-top:14px}label,.control{display:block;margin:0 0 12px}label>span,.control>span{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px}select,button{font:inherit;color:inherit;background:#30373f;border:1px solid var(--line);border-radius:3px;min-height:32px;padding:5px 8px}select{width:100%}button{cursor:pointer}button:hover{border-color:var(--accent)}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}button[aria-pressed=true]{border-color:var(--accent);background:#544633}input[type=range]{width:100%;margin:1px 0;accent-color:var(--accent)}output{color:var(--accent);font-variant-numeric:tabular-nums;font-size:12px}h2{font-size:13px;margin:0 0 14px;border-left:3px solid var(--accent);padding-left:8px}.row{display:flex;gap:6px}.row>*{flex:1}.help{font-size:11px;color:var(--muted);line-height:1.7;margin:9px 0 0}.stage{min-width:0;position:relative;overflow:hidden}#viewport{width:100%;height:100%;display:block;touch-action:none}.toolbar{position:absolute;left:16px;top:15px;display:flex;gap:6px;padding:5px;background:#252b31e8;border:1px solid var(--line);border-radius:4px}.caption{position:absolute;left:17px;bottom:18px;pointer-events:none;max-width:calc(100% - 34px);background:#1d2228d9;padding:9px 12px;border-left:2px solid var(--accent);line-height:1.65}#view-label{font-weight:600}#stats{font-size:12px;color:var(--muted)}#diagnostic{color:#e8c088;white-space:pre-line}details{font-size:11px;color:var(--muted);line-height:1.7}summary{cursor:pointer;margin-bottom:8px}#timing{font-variant-numeric:tabular-nums}.side-list{display:flex;gap:8px;flex-wrap:wrap}.side-list label{margin:0;display:flex;align-items:center;gap:3px}.side-list input{accent-color:var(--accent)}[hidden]{display:none!important}@media(max-width:700px){header{padding:8px 12px;height:76px}header small{font-size:10px}.gate{font-size:10px}main{height:calc(100dvh - 76px);grid-template-columns:216px minmax(0,1fr)}aside{padding:10px}.toolbar{left:9px;top:9px;flex-wrap:wrap;max-width:calc(100% - 18px)}.caption{left:9px;bottom:9px;font-size:11px}.toolbar button{font-size:11px}h1{font-size:16px}}
</style>
<header><div><h1>岩体塑形</h1><small>造型原型 · R0–R3　/　正式工坊未接入</small></div><span class="gate">Gate R-A · 造型待确认</span></header>
<main><aside>
<section><label><span>结构预设</span><select id="preset"><option value="columnar-wall">柱状岩壁</option><option value="terraced-rim">层阶崖岸</option></select></label>
<label><span>原创验证模型</span><select id="fixture"></select></label>
<div class="row"><label><span>固定种子</span><select id="seed"><option>17</option><option>73</option><option>211</option></select></label><label><span>每格 / 米</span><select id="cellSize"><option value="0.25">0.25</option><option value="0.125">0.125</option><option value="0.0625">0.0625</option></select></label></div></section>
<section><h2 id="parameter-title">柱状结构 · SAMPLE</h2><div id="parameters"></div></section>
<section id="side-section"><h2>影响侧面</h2><div class="side-list"><label><input type="checkbox" value="0" checked>+X</label><label><input type="checkbox" value="1" checked>−X</label><label><input type="checkbox" value="2" checked>+Y</label><label><input type="checkbox" value="3" checked>−Y</label></div></section>
<section><button id="download" style="width:100%">下载原形、结果与参数</button><p class="help">右键拖动旋转 · 中键平移<br>滚轮缩放 · 所有调整从原形重算</p></section>
<section><details><summary>计算与适用范围</summary><div id="timing"></div><p>仅向内削切。薄片、悬挑等不支持的输入保持原形。这里只验证结构方向，尚未接入工坊、材质绘制、历史或导出。</p><p>参数单位为格，旁注显示实际米数。灰模采用同一材质与普通均匀光。</p></details></section>
</aside><div class="stage"><canvas id="viewport" aria-label="可旋转的真实体素灰模"></canvas><div class="toolbar"><button id="original" aria-pressed="false">查看原形</button><button id="reset">复位视角</button></div><div class="caption"><div id="view-label">正在生成</div><div id="stats"></div><div id="diagnostic" role="status"></div></div></div></main>
<script src="viewer.js"></script>
</html>
