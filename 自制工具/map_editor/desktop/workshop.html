<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' data: blob:; worker-src 'self' blob:"
    />
    <title>星骸 · 场景工坊</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="workshop-theme.css" />
    <link rel="stylesheet" href="workshop.css" /><link rel="stylesheet" href="workshop-shell.css" />
  </head>
  <body class="workshop">
    <header class="workshop-bar">
      <strong>星骸 / 场景工坊 <small>WORKSHOP</small></strong>
      <nav>
        <button data-workspace="project">项目与资产</button
        ><button data-workspace="module">模块编辑</button
        ><button data-workspace="assembly">场景装配</button
        ><button data-workspace="publish">发布</button>
      </nav>
      <span id="project-title">未打开项目</span>
    </header>
    <section id="project-workspace" class="workshop-page"></section>
    <section id="module-workspace" hidden>
      <div class="module-context">
        <select id="module-tabs" aria-label="当前模块"></select
        ><label>模块名称<input id="module-name" maxlength="200" /></label
        ><details id="module-root-menu"><summary>根点</summary><div class="root-menu-content">
          <div class="root-presets"><button id="module-root-bottom">底面中心</button><button id="module-root-center">包围盒中心</button></div>
          <label>定位面<select id="module-root-face"><option value="bottom">底面</option><option value="top">顶面</option><option value="front">前面</option><option value="back">后面</option><option value="left">左面</option><option value="right">右面</option></select></label>
          <div id="module-root-anchors" aria-label="面上九宫格定位"></div>
          <label>选点吸附<select id="module-root-snap"><option value="free">自由</option><option value="vertex">网格交点</option><option value="center">体素中心</option></select></label>
          <div class="root-presets"><button id="module-root-pick">面上选点</button><button id="module-root-cancel" hidden>取消选点</button></div>
          <label>X / Y / Z（米）<input id="module-root" value="0,0,0" /></label><button id="module-root-apply">应用坐标</button>
          <small>资产定位点 · 不改变物体操作轴</small>
        </div></details>
        <button id="save-draft">保存草稿</button
        ><button id="migrate-module" hidden>保存并转换为项目资产</button
        ><button id="asset-folder" hidden>保存文件夹：默认</button
        ><button id="save-asset-as" hidden>另存为新资产</button
        ><button id="export-asset-fbx" hidden>导出 FBX…</button
        ><button id="close-module">关闭模块</button>
      </div>
      <div id="module-export-result" class="module-export-result" hidden></div>
      <main id="app"></main>
    </section>
    <section id="assembly-workspace" class="workshop-page" hidden>
      <h1>场景装配</h1>
      <p>
        正在载入装配视口与实例工具。
      </p>
    </section>
    <section id="publish-workspace" class="workshop-page" hidden>
      <h1>发布</h1>
      <p>正在载入发布检查与版本历史。</p>
    </section>
    <output id="workshop-message" aria-live="polite"
      >从新建项目或打开项目开始。</output
    >
    <script src="workshop.js"></script>
  </body>
</html>
